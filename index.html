<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Mi Rica Dulce Tentación</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf2f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .header {
            margin-bottom: 20px;
        }
        .logo {
            max-width: 250px;
            height: auto;
            border-radius: 50%;
            border: 4px solid #b83280;
            object-fit: cover;
        }
        h1 {
            color: #b83280;
            margin-top: 10px;
        }
        .btn-toggle {
            background-color: #b83280;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 5px;
        }
        .btn-toggle:hover {
            background-color: #901964;
        }
        .instruction {
            font-size: 14px;
            color: #555;
            margin-bottom: 30px;
        }
        .catalog-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 220px;
            padding: 15px;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }
        .editable {
            border: 1px dashed transparent;
            padding: 2px 5px;
            margin-top: 5px;
        }
        .product-name {
            font-size: 17px;
            font-weight: bold;
            color: #333;
        }
        .product-price {
            font-size: 16px;
            color: #b83280;
            font-weight: bold;
        }
        .editing .editable {
            border-color: #b83280;
            background-color: #fff0f6;
            cursor: text;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="1000231200.jpg" alt="Logo Mi Rica Dulce Tentación" class="logo">
        <h1>Mi Rica Dulce Tentación</h1>
    </div>
    
    <div>
        <button class="btn-toggle" onclick="toggleEditMode()">Activar/Desactivar Edición</button>
        <button class="btn-toggle" onclick="guardarCambios()" style="background-color: #27ae60;">Guardar Cambios</button>
    </div>
    <div class="instruction">Activa la edición para hacer clic y modificar cualquier nombre o precio localmente.</div>

    <div class="catalog-container" id="catalog">
        <script>
            // ==========================================
            // PRECIOS OFICIALES PARA TODO EL MUNDO:
            // Cambia aquí los textos o precios si quieres 
            // que se actualicen de forma definitiva al subirlo a GitHub.
            // ==========================================
            const preciosOficiales = {
                1: { nombre: "Producto 1", precio: "1.000" },
                2: { nombre: "Producto 2", precio: "1.000" },
                3: { nombre: "Producto 3", precio: "1.000" },
                4: { nombre: "Producto 4", precio: "1.000" },
                5: { nombre: "Producto 5", precio: "1.000" },
                6: { nombre: "Producto 6", precio: "1.000" },
                7: { nombre: "Producto 7", precio: "1.000" },
                8: { nombre: "Producto 8", precio: "1.000" },
                9: { nombre: "Producto 9", precio: "1.000" },
                10: { nombre: "Producto 10", precio: "1.000" },
                11: { nombre: "Producto 11", precio: "1.000" },
                12: { nombre: "Producto 12", precio: "1.000" },
                13: { nombre: "Producto 13", precio: "1.000" },
                14: { nombre: "Producto 14", precio: "1.000" },
                15: { nombre: "Producto 15", precio: "1.000" },
                16: { nombre: "Producto 16", precio: "1.000" },
                17: { nombre: "Producto 17", precio: "1.000" },
                18: { nombre: "Producto 18", precio: "1.000" },
                19: { nombre: "Producto 19", precio: "1.000" },
                20: { nombre: "Producto 20", precio: "1.000" },
                21: { nombre: "Producto 21", precio: "1.000" },
                22: { nombre: "Producto 22", precio: "1.000" },
                23: { nombre: "Producto 23", precio: "1.000" },
                24: { nombre: "Producto 24", precio: "1.000" },
                25: { nombre: "Producto 25", precio: "1.000" },
                26: { nombre: "Producto 26", precio: "1.000" },
                27: { nombre: "Producto 27", precio: "1.000" },
                28: { nombre: "Producto 28", precio: "1.000" },
                29: { nombre: "Producto 29", precio: "1.000" },
                30: { nombre: "Producto 30", precio: "1.000" },
                31: { nombre: "Producto 31", precio: "1.000" },
                32: { nombre: "Producto 32", precio: "1.000" },
                33: { nombre: "Producto 33", precio: "1.000" },
                34: { nombre: "Producto 34", precio: "1.000" },
                35: { nombre: "Producto 35", precio: "1.000" },
                36: { nombre: "Producto 36", precio: "1.000" }
            };

            for (let i = 1; i <= 36; i++) {
                let defNombre = preciosOficiales[i] ? preciosOficiales[i].nombre : `Producto ${i}`;
                let defPrecio = preciosOficiales[i] ? preciosOficiales[i].precio : "1.000";

                let nombreGuardado = localStorage.getItem(`nombre_${i}`) || defNombre;
                let precioGuardado = localStorage.getItem(`precio_${i}`) || defPrecio;
                
                document.write(`
                    <div class="product-card">
                        <img src="foto${i}.jpg" alt="Producto ${i}" onerror="this.style.display='none'">
                        <div class="product-name editable" contenteditable="false" id="nombre_box_${i}" data-type="nombre" data-id="${i}">${nombreGuardado}</div>
                        <div class="product-price editable" contenteditable="false" id="precio_box_${i}" data-type="precio" data-id="${i}">${precioGuardado}</div>
                    </div>
                `);
            }
        </script>
    </div>

    <script>
        function toggleEditMode() {
            const catalog = document.getElementById('catalog');
            catalog.classList.toggle('editing');
            const editables = document.querySelectorAll('.editable');
            editables.forEach(el => {
                const isEditable = el.getAttribute('contenteditable') === 'true';
                el.setAttribute('contenteditable', !isEditable);
            });
        }

        function guardarCambios() {
            const editables = document.querySelectorAll('.editable');
            editables.forEach(el => {
                const type = el.getAttribute('data-type');
                const id = el.getAttribute('data-id');
                const valor = el.innerText.trim();
                localStorage.setItem(`${type}_${id}`, valor);
            });
            alert('¡Cambios guardados localmente!');
        }
    </script>

</body>
</html>
